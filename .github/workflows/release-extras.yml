# Editor-extension packaging and publishing, run after the release-kit v2
# `release` workflow succeeds for a tag. Moved out of release.yml unchanged in
# substance; the tag comes from the triggering run instead of GITHUB_REF_NAME.
# Only tag-push runs qualify: a manually dispatched release run's head_branch is
# the default branch, not the tag, so dispatched re-runs skip the extras.
name: release-extras

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TAG: ${{ github.event.workflow_run.head_branch }}

jobs:
  ext-vscode:
    name: package vscode extension
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Sync extension version to tag
        working-directory: extensions/vscode
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node -e "const p=require('./package.json'); p.version='${version}'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2)+'\n')"
          echo "package.json version is now ${version}"

      - name: npm ci
        working-directory: extensions/vscode
        run: npm ci --no-audit --no-fund

      - name: Compile + package .vsix
        working-directory: extensions/vscode
        run: |
          set -euo pipefail
          npm run compile
          version="${TAG#v}"
          npx --yes @vscode/vsce@latest package \
            --no-dependencies \
            --out "casual-review-${version}.vsix"

      - name: Upload .vsix to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "${TAG}" -R "$GITHUB_REPOSITORY" \
            "extensions/vscode/casual-review-${version}.vsix" \
            --clobber

      # Marketplace publishing is gated on secrets being set. Until the
      # publisher account exists and a PAT is added, these steps no-op so
      # the workflow stays green on each tag push.
      - name: Publish to VS Code Marketplace
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT not set — skipping VS Code Marketplace publish."
            echo "To enable: register publisher 'casual-review' at"
            echo "https://marketplace.visualstudio.com/manage and add a PAT"
            echo "as repository secret VSCE_PAT."
            exit 0
          fi
          version="${TAG#v}"
          npx --yes @vscode/vsce@latest publish \
            --no-dependencies \
            --packagePath "casual-review-${version}.vsix"

      - name: Publish to Open VSX
        working-directory: extensions/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT not set — skipping Open VSX publish."
            echo "To enable: create an Open VSX namespace at https://open-vsx.org"
            echo "and add a PAT as repository secret OVSX_PAT."
            exit 0
          fi
          version="${TAG#v}"
          npx --yes ovsx publish "casual-review-${version}.vsix" -p "$OVSX_PAT"

  ext-jetbrains:
    name: package jetbrains plugin
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Sync plugin version to tag
        working-directory: extensions/jetbrains
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Replace the version assignment in build.gradle.kts.
          sed -i "s/^version = \"[^\"]*\"/version = \"${version}\"/" build.gradle.kts
          grep '^version = ' build.gradle.kts

      - name: gradlew buildPlugin
        working-directory: extensions/jetbrains
        run: ./gradlew --no-daemon buildPlugin

      - name: Upload .zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          src="extensions/jetbrains/build/distributions/casual-review-jetbrains-${version}.zip"
          ls -la "$(dirname "$src")"
          gh release upload "${TAG}" -R "$GITHUB_REPOSITORY" "$src" --clobber

      # Marketplace publish is gated on JETBRAINS_TOKEN; if missing, the
      # GitHub release still has the .zip for manual upload. The plugin's
      # build.gradle.kts must declare a `signing` + `publishing` block for
      # this to work end-to-end — currently absent and left to a follow-up.
      - name: Publish to JetBrains Marketplace
        working-directory: extensions/jetbrains
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${JETBRAINS_TOKEN:-}" ]; then
            echo "JETBRAINS_TOKEN not set — skipping JetBrains Marketplace publish."
            echo "To enable: create a hub permanent token at"
            echo "https://hub.jetbrains.com/users/me?tab=authentification and"
            echo "add it as repository secret JETBRAINS_TOKEN."
            exit 0
          fi
          if ! grep -q 'publishPlugin' build.gradle.kts; then
            echo "build.gradle.kts has no publishPlugin task wired up — skipping."
            echo "Add a publishing { token } block per the IntelliJ Platform"
            echo "Gradle Plugin docs to enable Marketplace publishing."
            exit 0
          fi
          ./gradlew --no-daemon publishPlugin -Ptoken="$JETBRAINS_TOKEN"

  ext-zed:
    name: package zed extension
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/zed
          key: zed-ext-release

      - name: Sync extension version to tag
        working-directory: extensions/zed
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sed -i "s/^version = \"[^\"]*\"/version = \"${version}\"/" extension.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"${version}\"/" Cargo.toml
          grep '^version = ' extension.toml Cargo.toml

      - name: cargo build --release --target wasm32-wasip1
        working-directory: extensions/zed
        run: cargo build --release --target wasm32-wasip1

      - name: Upload .wasm to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          src="extensions/zed/target/wasm32-wasip1/release/casual_review_zed.wasm"
          dst="casual-review-zed-${version}.wasm"
          cp "$src" "$dst"
          gh release upload "${TAG}" -R "$GITHUB_REPOSITORY" "$dst" --clobber

      # Zed has no API-driven publish flow. Distribution goes through a PR
      # to https://github.com/zed-industries/extensions referencing this
      # repo + tag. Surface the manual step rather than silently no-op.
      - name: Note about Zed extensions registry
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cat <<EOF
          Zed registry publish is manual.

          For first-time publish:
            1. Fork https://github.com/zed-industries/extensions
            2. Add an entry under extensions/casual-review/ pointing at
               this repo and tag v${version}.
            3. Open a PR; track the review on that repository.

          For subsequent updates:
            1. Update the version pin in extensions/casual-review/extension.toml
               on the fork to v${version}.
            2. Open a PR.

          The .wasm uploaded to this GitHub Release is for users installing
          the dev extension manually; the registry rebuilds from source.
          EOF
