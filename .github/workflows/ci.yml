name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new RustSec advisories surface without a push

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain (and rustfmt/clippy) pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --verbose
      - run: cargo test --locked --verbose

  msrv:
    name: msrv — rust-version is the toolchain we build with
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rust-version and rust-toolchain.toml agree
        id: floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 -E '^rust-version *=' Cargo.toml | cut -d'"' -f2)
          pinned=$(grep -m1 -E '^channel *=' rust-toolchain.toml | cut -d'"' -f2)
          echo "rust-version=$declared  channel=$pinned"
          if [ "$declared" != "$pinned" ]; then
            echo "::error::rust-version ($declared) and rust-toolchain.toml channel ($pinned) have drifted"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.floor.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      # `cargo +<floor>` explicitly, not bare `cargo`: rust-toolchain.toml would
      # otherwise override whatever was installed and the job would test nothing.
      - run: cargo +${{ steps.floor.outputs.version }} check --workspace --all-targets --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Honors .cargo/audit.toml (justified ignores only).
      - run: cargo audit

  ext-vscode:
    name: ext-vscode (package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: npm ci
        working-directory: extensions/vscode
        run: npm ci --no-audit --no-fund
      - name: tsc compile
        working-directory: extensions/vscode
        run: npm run compile
      - name: Package .vsix (pre-release naming)
        working-directory: extensions/vscode
        run: |
          set -euo pipefail
          # CI builds use the package.json version verbatim; release.yml syncs
          # it to the tag. The .vsix name picks up whatever version is set.
          npx --yes @vscode/vsce@latest package \
            --no-dependencies \
            --out "casual-review-ci.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-${{ github.sha }}
          path: extensions/vscode/casual-review-ci.vsix
          if-no-files-found: error
          retention-days: 14

  ext-jetbrains:
    name: ext-jetbrains (buildPlugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: gradlew buildPlugin
        working-directory: extensions/jetbrains
        run: ./gradlew --no-daemon buildPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: jetbrains-plugin-${{ github.sha }}
          path: extensions/jetbrains/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  ext-zed:
    name: ext-zed (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The repo-root rust-toolchain.toml applies here too; add the wasm target to it.
      - name: install pinned toolchain + wasm32-wasip1
        working-directory: extensions/zed
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extensions/zed
          key: zed-ext
      - name: cargo build --release --target wasm32-wasip1
        working-directory: extensions/zed
        run: cargo build --release --target wasm32-wasip1
      - uses: actions/upload-artifact@v7
        with:
          name: zed-extension-${{ github.sha }}
          path: extensions/zed/target/wasm32-wasip1/release/casual_review_zed.wasm
          if-no-files-found: error
          retention-days: 14
