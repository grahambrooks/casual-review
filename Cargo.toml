[package]
name = "casual-review"
version = "2026.5.2"
edition = "2021"
rust-version = "1.98.1"
description = "Store code-review comments and conversations inside your git repository"
license = "MIT OR Apache-2.0"
repository = "https://github.com/grahambrooks/casual-review"
homepage = "https://github.com/grahambrooks/casual-review"
readme = "README.md"
# CalVer: YYYY.M.D — year, month (1-12), day-of-month (1-31). Same-day
# re-releases bump to the next day, or use VERSION=... explicitly.

[[bin]]
name = "cr"
path = "src/main.rs"

[lib]
name = "casual_review"
path = "src/lib.rs"

[dependencies]
# CLI + error handling
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Serialization (JSON output, git notes payloads)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Cross-machine-stable hashing for comment IDs and anchor staleness
sha2 = "0.11"

# Structured logging (RUST_LOG)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"   # CLI integration tests
tempfile = "3"     # tempdirs for tests

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
